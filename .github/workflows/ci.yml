name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the client bundle
        run: pnpm build

      - name: Audit artifacts (module id, externals, embedded CSS, privacy)
        run: pnpm run audit

      - name: Check the published file list
        run: npm pack --dry-run
